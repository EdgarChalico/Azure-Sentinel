id: a7b167e2-9582-440b-8d47-53df2f73c4f4
name: Delinea - Sensitive secret accessed by new user (first access in 14 days)
description: |
  Detects when a user accesses a high-value secret for the first time, with no access to that
  same secret by that user in the prior 14 days. High-value secrets are identified by a tunable
  name pattern (admin, prod, root, domain, backup, key, token, cert, password, service accounts).
  First-time access to a sensitive secret can indicate lateral movement or credential targeting.
  Tune 'sensitivePattern' to match your high-value secret naming conventions.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: DelineaPlatformConnector
    dataTypes:
      - DelineaAuditEvents_CL
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - LateralMovement
  - CredentialAccess
relevantTechniques:
  - T1078
  - T1555
query: |
  let sensitivePattern = @"(?i)admin|prod|root|domain|backup|key|token|cert|password|sa-";
  let detectionWindow = 1h;
  let access = DelineaAuditEvents_CL
      | where TimeGenerated > ago(14d)
      | where Level == "PrivilegedActivity"
      | extend d = parse_json(RawData)
      | where tostring(d.eventType.name) == "Delinea.Vault.Secret.Viewed"
      | extend Actor = tostring(d.actor.name), SrcIP = tostring(d.source.host.network.ipAddress)
      | where isnotempty(Actor) and isnotempty(SecretId)
      | where SecretId matches regex sensitivePattern;
  let priorAccess = access
      | where TimeGenerated < ago(detectionWindow)
      | distinct Actor, SecretId;
  access
  | where TimeGenerated >= ago(detectionWindow)
  | join kind=leftanti priorAccess on Actor, SecretId
  | summarize FirstAccess = min(TimeGenerated), LastAccess = max(TimeGenerated), Accesses = count(),
              SourceIPs = make_set(SrcIP, 20) by Actor, SecretId
  | extend SrcIP = tostring(SourceIPs[0])
  | project FirstAccess, LastAccess, Actor, SecretId, Accesses, SourceIPs, SrcIP
  | sort by FirstAccess desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Actor
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIP
customDetails:
  SecretId: SecretId
  Accesses: Accesses
  FirstAccess: FirstAccess
version: 1.0.0
kind: Scheduled
