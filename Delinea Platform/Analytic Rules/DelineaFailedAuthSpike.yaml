id: e6d743f2-a538-455f-899c-251926b9071e
name: Delinea - Failed authentication spike (single account)
description: |
  Detects when a single account accumulates an unusually high number of failed authentication
  events within a short window. Failed authentications are identified from Delinea Identity MFA
  events where the MFA result or password factor failed, or any login fail reason is present.
  A burst of failures for one account can indicate brute-force or credential-stuffing activity.
  Tune 'threshold' to your environment.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: DelineaPlatformConnector
    dataTypes:
      - DelineaAuditEvents_CL
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
query: |
  let threshold = 10;
  DelineaAuditEvents_CL
  | where TimeGenerated > ago(15m)
  | extend d = parse_json(RawData)
  | extend Actor = tostring(d.actor.name), SrcIP = tostring(d.source.host.network.ipAddress),
           MfaResult = tostring(d.additionalAttributes.MfaResult[0]),
           FactorPassword = tostring(d.additionalAttributes.FactorPassword[0]),
           FailReason = tostring(d.additionalAttributes.FailReason[0])
  | where MfaResult == "Failed" or FactorPassword == "Failed" or isnotempty(FailReason)
  | where isnotempty(Actor)
  | summarize Failures = count(), DistinctSourceIPs = dcount(SrcIP), SourceIPs = make_set(SrcIP, 20),
              FailReasons = make_set(FailReason, 10), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by Actor
  | where Failures >= threshold
  | extend SrcIP = tostring(SourceIPs[0])
  | project Actor, Failures, DistinctSourceIPs, SourceIPs, FailReasons, SrcIP, StartTime, EndTime
  | sort by Failures desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Actor
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIP
customDetails:
  Failures: Failures
  DistinctSourceIPs: DistinctSourceIPs
  FailReasons: FailReasons
version: 1.0.0
kind: Scheduled
