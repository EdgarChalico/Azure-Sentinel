id: c24252d1-d98c-48db-b2f9-4cb37dd2208a
name: Delinea - Privilege escalation detected (role / permission changes)
description: |
  Detects audit events whose event type or message indicate possible privilege escalation -
  role assignments, permission additions, admin grants, group/owner changes, and privileged-role
  membership changes. Read-only "viewed" events are excluded. Review the FieldChanges column for
  the before/after of each change. Tune 'escalationPattern' to your tenant's event taxonomy.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: DelineaPlatformConnector
    dataTypes:
      - DelineaAuditEvents_CL
queryFrequency: 15m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
  - Persistence
relevantTechniques:
  - T1098
  - T1078
query: |
  let escalationPattern = @"(?i)role|permission|grant|admin|privileg|member|assign|elevat|owner";
  DelineaAuditEvents_CL
  | where TimeGenerated > ago(30m)
  | where ingestion_time() > ago(15m)
  | extend d = parse_json(RawData)
  | extend EventName = tostring(d.eventType.name), Actor = tostring(d.actor.name),
           TargetName = tostring(d.target.name), TargetDisplay = tostring(d.target.displayName),
           Msg = tostring(d.displayMessage), SrcIP = tostring(d.source.host.network.ipAddress)
  | where EventName matches regex escalationPattern or Msg matches regex escalationPattern
  | where EventName !has "Viewed" and Msg !has "viewed"
  | project TimeGenerated, EventName, Actor, TargetName, TargetDisplay, Msg, SrcIP
  | sort by TimeGenerated desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Actor
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIP
customDetails:
  EventName: EventName
  Target: TargetDisplay
  Message: Msg
version: 1.1.0
kind: Scheduled
